[package]
name = "analizador-disco"
version = "1.0.0"
edition = "2021"
description = "Analizador de disco: encuentra y elimina los archivos más grandes"

[dependencies]
eframe = "0.32"
egui_extras = "0.32"
jwalk = "0.8"
trash = "5"
sysinfo = { version = "0.35", default-features = false, features = ["disk"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
